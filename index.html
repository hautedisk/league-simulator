<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リーグ戦 順位決定＆詳細条件算出シミュレーター</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">🤾 順位決定＆詳細条件算出シミュレーター</h1>

    <!-- タブナビゲーション -->
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button onclick="switchTab(1)" id="tab-btn-1" class="flex-1 py-3 px-4 text-center font-bold border-b-2 border-blue-500 text-blue-600">
        1. 順位＆全条件算出
      </button>
      <button onclick="switchTab(2)" id="tab-btn-2" class="flex-1 py-3 px-4 text-center font-bold text-gray-500 hover:text-gray-700">
        2. 勝敗・スコア入力
      </button>
      <button onclick="switchTab(3)" id="tab-btn-3" class="flex-1 py-3 px-4 text-center font-bold text-gray-500 hover:text-gray-700">
        3. ルール＆優先順位設定
      </button>
    </div>

    <!-- ページ 1: 順位＆全条件算出 -->
    <div id="page-1" class="tab-content bg-white p-6 rounded-b-lg shadow-md">
      
      <!-- 25%ルールの適用状態ステータスバナー -->
      <div id="rule-status-banner" class="mb-6 p-4 rounded-lg border font-bold flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 shadow-sm">
        <!-- JS動的生成 -->
      </div>

      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <span>📊</span> 現在の暫定順位表
      </h2>
      <div class="overflow-x-auto mb-8">
        <table class="w-full text-left border-collapse text-sm md:text-base">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-2">順位</th>
              <th class="p-2">チーム名</th>
              <th class="p-2">ポイント</th>
              <th class="p-2">pt取得率</th>
              <th class="p-2">得点</th>
              <th class="p-2">失点</th>
              <th class="p-2">得失点</th>
              <th class="p-2">25%ルール状況</th>
            </tr>
          </thead>
          <tbody id="standings-table-body">
            <!-- JS動的生成 -->
          </tbody>
        </table>
      </div>

      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <span>🎯</span> 残り試合の全条件パターン算出 (+10点〜-10点差 全計算)
      </h2>
      <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
        <div class="flex flex-wrap items-center gap-4 mb-4">
          <label class="font-bold">分析対象チーム:</label>
          <select id="calc-team-select" class="border rounded p-2 bg-white font-semibold" onchange="calculateAllConditions()"></select>
        </div>
        
        <div id="calc-result" class="space-y-4">
          <!-- JSで全パターン結果を出力 -->
        </div>
      </div>
    </div>

    <!-- ページ 2: 勝敗・スコア入力 -->
    <div id="page-2" class="tab-content hidden bg-white p-6 rounded-b-lg shadow-md">
      <!-- チーム設定セクション -->
      <div class="mb-8 border-b pb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span>👥</span> 参加チーム設定
          </h2>
          <button onclick="addTeam()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-1.5 px-4 rounded text-sm shadow">
            ＋ チーム追加
          </button>
        </div>
        
        <div id="teams-inputs-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          <!-- JS動的生成 -->
        </div>
      </div>

      <!-- 対戦結果入力セクション -->
      <div>
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold flex items-center gap-2">
            <span>⚔️</span> 試合結果・スコア入力
          </h2>
          <button onclick="resetScores()" class="text-xs text-red-500 hover:underline">
            スコアのみ全クリア
          </button>
        </div>
        
        <div id="matches-list" class="space-y-3">
          <!-- JS動的生成 -->
        </div>
      </div>
    </div>

    <!-- ページ 3: ルール設定＆優先順位設定 -->
    <div id="page-3" class="tab-content hidden bg-white p-6 rounded-b-lg shadow-md space-y-6">
      
      <div>
        <h3 class="text-lg font-bold mb-3 border-b pb-1">① 特殊ルールのON/OFF設定</h3>
        <label class="flex items-start gap-3 p-4 bg-gray-50 border rounded-lg cursor-pointer hover:bg-blue-50 transition">
          <input type="checkbox" id="rule-use-25" class="w-5 h-5 mt-0.5 text-blue-600 rounded" checked onchange="toggle25Rule()">
          <div>
            <span class="font-bold text-gray-800 block">獲得可能ポイント25%未満チームの成績（得点・失点）を除外する</span>
            <span class="text-xs text-gray-500">※チェックを入れると、pt取得率が25%未満のチームとの対戦スコアを順位決定用の「得失点差」「総得点」から自動的に除外します。</span>
          </div>
        </label>
      </div>

      <div>
        <h3 class="text-lg font-bold mb-2 border-b pb-1">② 基本勝ち点設定</h3>
        <div class="grid grid-cols-3 gap-4 max-w-md">
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">勝ち</label>
            <input type="number" id="pts-win" value="2" class="w-full border rounded p-2 text-center font-bold" onchange="updateRulePts()">
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">引き分け</label>
            <input type="number" id="pts-draw" value="1" class="w-full border rounded p-2 text-center font-bold" onchange="updateRulePts()">
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">負け</label>
            <input type="number" id="pts-loss" value="0" class="w-full border rounded p-2 text-center font-bold" onchange="updateRulePts()">
          </div>
        </div>
      </div>

      <div>
        <h3 class="text-lg font-bold mb-3 border-b pb-1">③ 順位決定の優先順位 (上位項目が最優先)</h3>
        <div id="priority-list" class="space-y-2 max-w-xl">
          <!-- JS動的生成 -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- 初期データ構造 ---
    let state = {
      rules: { win: 2, draw: 1, loss: 0, use25Rule: true },
      priorityOrder: [
        { id: "pts", name: "ポイント数 (勝ち点)" },
        { id: "subGd", name: "【25%除外】適用後の得失点差" },
        { id: "subGf", name: "【25%除外】適用後の総得点" },
        { id: "h2h", name: "当該チーム間の【直接対決結果】" },
        { id: "allGd", name: "全競技の【得失点差】" },
        { id: "allGf", name: "全競技の【総得点】" }
      ],
      teams: ["チームA", "チームB", "チームC", "チームD"],
      matchesMap: {
        "チームA_チームB": { homeScore: , awayScore: , played: true },
        "チームC_チームD": { homeScore: , awayScore: , played: true },
        "チームA_チームC": { homeScore: , awayScore: , played: true },
        "チームB_チームD": { homeScore: , awayScore: , played: true }
      }
    };

    function getMatchList() {
      let list = [];
      for (let i = 0; i < state.teams.length; i++) {
        for (let j = i + 1; j < state.teams.length; j++) {
          const home = state.teams[i];
          const away = state.teams[j];
          const key = `${home}_${away}`;
          const reverseKey = `${away}_${home}`;

          let matchData = state.matchesMap[key] || state.matchesMap[reverseKey] || { homeScore: null, awayScore: null, played: false };
          
          list.push({
            key: key,
            home: home,
            away: away,
            homeScore: matchData.homeScore,
            awayScore: matchData.awayScore,
            played: matchData.played
          });
        }
      }
      return list;
    }

    function switchTab(pageNum) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`page-${pageNum}`).classList.remove('hidden');
      
      [1, 2, 3].forEach(i => {
        const btn = document.getElementById(`tab-btn-${i}`);
        btn.className = (i === pageNum) 
          ? "flex-1 py-3 px-4 text-center font-bold border-b-2 border-blue-500 text-blue-600"
          : "flex-1 py-3 px-4 text-center font-bold text-gray-500 hover:text-gray-700";
      });

      if (pageNum === 1) updatePage1();
      if (pageNum === 2) renderPage2();
      if (pageNum === 3) renderPage3();
    }

    // --- 順位計算コアロジック ---
    function calculateStandings(customMatches = null) {
      const matchesList = customMatches || getMatchList();
      let stats = {};
      
      state.teams.forEach(t => {
        stats[t] = { 
          team: t, pts: 0, totalMatches: 0,
          allGf: 0, allGa: 0, allGd: 0,
          subGf: 0, subGa: 0, subGd: 0,
          isExcluded25: false, note: ""
        };
      });

      matchesList.filter(m => m.played).forEach(m => {
        const h = m.home, a = m.away;
        if (!stats[h] || !stats[a]) return;

        stats[h].totalMatches++;
        stats[a].totalMatches++;

        stats[h].allGf += m.homeScore; stats[h].allGa += m.awayScore;
        stats[a].allGf += m.awayScore; stats[a].allGa += m.homeScore;

        if (m.homeScore > m.awayScore) {
          stats[h].pts += state.rules.win;
          stats[a].pts += state.rules.loss;
        } else if (m.homeScore < m.awayScore) {
          stats[a].pts += state.rules.win;
          stats[h].pts += state.rules.loss;
        } else {
          stats[h].pts += state.rules.draw;
          stats[a].pts += state.rules.draw;
        }
      });

      Object.values(stats).forEach(s => s.allGd = s.allGf - s.allGa);

      let excludedTeams = [];
      if (state.rules.use25Rule) {
        Object.values(stats).forEach(s => {
          const maxPossiblePts = s.totalMatches * state.rules.win;
          if (maxPossiblePts > 0) {
            const ratio = s.pts / maxPossiblePts;
            if (ratio < 0.25) {
              s.isExcluded25 = true;
              s.note = "25%未満 (対戦除外対象)";
              excludedTeams.push(s.team);
            }
          }
        });
      }

      matchesList.filter(m => m.played).forEach(m => {
        const h = m.home, a = m.away;
        if (!stats[h] || !stats[a]) return;

        if (!excludedTeams.includes(a)) {
          stats[h].subGf += m.homeScore;
          stats[h].subGa += m.awayScore;
        }
        if (!excludedTeams.includes(h)) {
          stats[a].subGf += m.awayScore;
          stats[a].subGa += m.homeScore;
        }
      });
      Object.values(stats).forEach(s => s.subGd = s.subGf - s.subGa);

      let sorted = Object.values(stats).sort((a, b) => {
        for (let rule of state.priorityOrder) {
          if (rule.id === "pts" && b.pts !== a.pts) return b.pts - a.pts;
          
          if (state.rules.use25Rule) {
            if (rule.id === "subGd" && b.subGd !== a.subGd) return b.subGd - a.subGd;
            if (rule.id === "subGf" && b.subGf !== a.subGf) return b.subGf - a.subGf;
          }

          if (rule.id === "allGd" && b.allGd !== a.allGd) return b.allGd - a.allGd;
          if (rule.id === "allGf" && b.allGf !== a.allGf) return b.allGf - a.allGf;
          if (rule.id === "h2h") {
            const h2h = matchesList.find(m => m.played && 
              ((m.home === a.team && m.away === b.team) || (m.home === b.team && m.away === a.team))
            );
            if (h2h && h2h.homeScore !== h2h.awayScore) {
              const aScore = h2h.home === a.team ? h2h.homeScore : h2h.awayScore;
              const bScore = h2h.home === b.team ? h2h.homeScore : h2h.awayScore;
              if (aScore !== bScore) return bScore - aScore;
            }
          }
        }
        return 0;
      });

      return { sorted, excludedCount: excludedTeams.length };
    }

    function updatePage1() {
      const { sorted: standings, excludedCount } = calculateStandings();
      
      const banner = document.getElementById('rule-status-banner');
      if (!state.rules.use25Rule) {
        banner.className = "mb-6 p-4 rounded-lg border border-gray-300 bg-gray-100 text-gray-700 font-bold flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 shadow-sm";
        banner.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xl">⚪</span>
            <span>【25%除外ルール】: <span class="text-gray-600">無効 (全対戦の成績を集計)</span></span>
          </div>
          <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">3ページ目で設定変更可能</span>
        `;
      } else if (excludedCount > 0) {
        banner.className = "mb-6 p-4 rounded-lg border border-red-300 bg-red-50 text-red-800 font-bold flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 shadow-sm";
        banner.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xl">⚠️</span>
            <span>【25%除外ルール】: <span class="text-red-600 font-extrabold">適用中 (${excludedCount}チームが対象)</span></span>
          </div>
          <span class="text-xs bg-red-200 text-red-800 px-2.5 py-1 rounded-full">該当チームとの対戦結果を除外して集計中</span>
        `;
      } else {
        banner.className = "mb-6 p-4 rounded-lg border border-green-300 bg-green-50 text-green-800 font-bold flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 shadow-sm";
        banner.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xl">✅</span>
            <span>【25%除外ルール】: <span class="text-green-700">有効 (現在、該当する除外対象チームはありません)</span></span>
          </div>
          <span class="text-xs bg-green-200 text-green-800 px-2 py-1 rounded">通常集計中</span>
        `;
      }

      const tbody = document.getElementById('standings-table-body');
      tbody.innerHTML = '';

      standings.forEach((s, idx) => {
        const maxPts = s.totalMatches * state.rules.win;
        const rateVal = maxPts > 0 ? (s.pts / maxPts) : 0;
        const rateText = maxPts > 0 ? (rateVal * 100).toFixed(0) + '%' : '0%';

        let noteBadge = '<span class="text-xs text-gray-400">通常対象</span>';
        if (state.rules.use25Rule && s.isExcluded25) {
          noteBadge = '<span class="text-xs bg-red-500 text-white font-bold px-2 py-0.5 rounded">25%未満(対戦除外)</span>';
        }

        const displayGf = state.rules.use25Rule ? `${s.allGf} <span class="text-xs text-gray-400">(${s.subGf})</span>` : s.allGf;
        const displayGa = state.rules.use25Rule ? `${s.allGa} <span class="text-xs text-gray-400">(${s.subGa})</span>` : s.allGa;
        const displayGdVal = s.allGd > 0 ? '+' + s.allGd : s.allGd;
        const subGdVal = s.subGd > 0 ? '+' + s.subGd : s.subGd;
        const displayGd = state.rules.use25Rule ? `${displayGdVal} <span class="text-xs text-gray-400">(${subGdVal})</span>` : displayGdVal;

        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50 ${s.isExcluded25 ? 'bg-red-50/50' : ''}">
            <td class="p-2 font-bold text-center">${idx + 1}</td>
            <td class="p-2 font-semibold">${s.team}</td>
            <td class="p-2 font-bold text-blue-600">${s.pts}</td>
            <td class="p-2 text-xs font-semibold ${rateVal < 0.25 && state.rules.use25Rule ? 'text-red-500 font-bold' : 'text-gray-500'}">${rateText}</td>
            <td class="p-2">${displayGf}</td>
            <td class="p-2">${displayGa}</td>
            <td class="p-2 font-medium">${displayGd}</td>
            <td class="p-2">${noteBadge}</td>
          </tr>
        `;
      });

      const teamSelect = document.getElementById('calc-team-select');
      const prevTeam = teamSelect.value;
      teamSelect.innerHTML = state.teams.map(t => `<option value="${t}">${t}</option>`).join('');
      if (state.teams.includes(prevTeam)) teamSelect.value = prevTeam;

      calculateAllConditions();
    }

    // --- 連続する点数差の範囲を文章化する関数 ---
    function formatDiffRangeText(diffs) {
      if (!diffs || diffs.length === 0) return null;

      diffs.sort((a, b) => b - a); // 降順 (+10, +9, ... -10)
      const maxDiff = Math.max(...diffs);
      const minDiff = Math.min(...diffs);

      // 範囲文字列の作成
      let maxText = "";
      let minText = "";

      if (maxDiff === 10) {
        maxText = "+10点差以上";
      } else if (maxDiff > 0) {
        maxText = `+${maxDiff}点差`;
      } else if (maxDiff === 0) {
        maxText = "引き分け";
      } else {
        maxText = `${Math.abs(maxDiff)}点差の敗戦`;
      }

      if (minDiff === -10) {
        minText = "-10点差以上の大敗";
      } else if (minDiff > 0) {
        minText = `+${minDiff}点差`;
      } else if (minDiff === 0) {
        minText = "引き分け";
      } else {
        minText = `${Math.abs(minDiff)}点差の敗戦`;
      }

      if (maxDiff === minDiff) {
        return maxText;
      }

      // 「+5点差以上の勝利」などの判定
      if (maxDiff === 10 && minDiff > 0) return `+${minDiff}点差以上の勝利`;
      if (maxDiff === 10 && minDiff === 0) return `勝利 または 引き分け`;
      if (maxDiff < 0 && minDiff === -10) return `${Math.abs(maxDiff)}点差以上の敗戦`;

      return `${maxText} ～ ${minText}`;
    }

    // --- 全点数差（+10〜-10）シミュレーション ---
    function calculateAllConditions() {
      const targetTeam = document.getElementById('calc-team-select').value;
      const resultDiv = document.getElementById('calc-result');

      if (!targetTeam || !state.teams.includes(targetTeam)) {
        resultDiv.innerHTML = "チームを選択してください。";
        return;
      }

      const matchList = getMatchList();
      const unplayed = matchList.filter(m => !m.played);

      if (unplayed.length === 0) {
        resultDiv.innerHTML = "<div class='bg-white p-4 rounded text-center text-gray-500'>全試合終了済です。上記の順位表が最終結果となります。</div>";
        return;
      }

      const myUnplayed = unplayed.filter(m => m.home === targetTeam || m.away === targetTeam);
      
      if (myUnplayed.length === 0) {
        resultDiv.innerHTML = `<div class='bg-white p-4 rounded text-center text-gray-600'><strong>${targetTeam}</strong> は残り試合がありません（他会場の結果待ち）。</div>`;
        return;
      }

      // +10点差から-10点差までの21パターンを1点刻みで全計算
      let scoreDiffResults = []; // { diff: 5, rank: 1 }
      let rankToDiffs = {};

      for (let diff = 10; diff >= -10; diff--) {
        let testMatches = JSON.parse(JSON.stringify(matchList));
        
        myUnplayed.forEach(m => {
          let tm = testMatches.find(x => x.key === m.key);
          tm.played = true;
          const baseScore = 20;
          if (diff >= 0) {
            if (tm.home === targetTeam) { tm.homeScore = baseScore + diff; tm.awayScore = baseScore; }
            else { tm.homeScore = baseScore; tm.awayScore = baseScore + diff; }
          } else {
            const lossVal = Math.abs(diff);
            if (tm.home === targetTeam) { tm.homeScore = baseScore; tm.awayScore = baseScore + lossVal; }
            else { tm.homeScore = baseScore + lossVal; tm.awayScore = baseScore; }
          }
        });

        const rank = calculateStandings(testMatches).sorted.findIndex(s => s.team === targetTeam) + 1;
        scoreDiffResults.push({ diff, rank });

        if (!rankToDiffs[rank]) rankToDiffs[rank] = [];
        rankToDiffs[rank].push(diff);
      }

      const ruleText = state.rules.use25Rule 
        ? '<span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded ml-2">※25%除外ルール適用中</span>'
        : '<span class="text-xs bg-gray-200 text-gray-700 font-semibold px-2 py-0.5 rounded ml-2">※25%除外ルール無し</span>';

      let html = `<div class="font-bold text-gray-700 text-base mb-2 flex items-center"><span>📋 【${targetTeam}】点数差別 順位到達条件一覧</span> ${ruleText}</div>`;
      
      // 順位ごとの範囲まとめ表示
      for (let r = 1; r <= state.teams.length; r++) {
        const diffs = rankToDiffs[r] || [];
        const rangeText = formatDiffRangeText(diffs);

        let cardBg = "bg-white border-gray-200";
        let rankBadge = "bg-gray-500 text-white";

        if (r === 1) { cardBg = "bg-amber-50 border-amber-300"; rankBadge = "bg-amber-500 text-white"; }
        else if (r === 2) { cardBg = "bg-slate-50 border-slate-300"; rankBadge = "bg-slate-500 text-white"; }
        else if (r === 3) { cardBg = "bg-orange-50 border-orange-300"; rankBadge = "bg-orange-600 text-white"; }

        html += `
          <div class="p-3 border rounded-lg ${cardBg} shadow-sm flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
            <div class="flex items-center gap-2 md:w-28 flex-shrink-0">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${rankBadge}">${r}位</span>
              <span class="font-bold text-sm">になる条件</span>
            </div>
            <div class="text-sm font-extrabold text-gray-800 flex-1">
              ${rangeText ? `・ ${rangeText}` : '<span class="text-gray-400 text-xs font-normal">※+10～-10点差の範囲では到達不可</span>'}
            </div>
          </div>
        `;
      }

      // 1点ごとの詳細内訳（アコーディオン）
      html += `
        <details class="mt-4 bg-white rounded-lg border p-3">
          <summary class="font-bold text-xs text-blue-600 cursor-pointer hover:underline">
            🔍 ＋10点差～-10点差（1点単位）の全計算結果ログを開く
          </summary>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-3 text-xs">
            ${scoreDiffResults.map(item => {
              let label = item.diff > 0 ? `+${item.diff}点勝` : (item.diff === 0 ? `引き分け` : `${item.diff}点負`);
              let bg = item.rank === 1 ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-gray-50 text-gray-700';
              return `
                <div class="p-1.5 border rounded flex justify-between items-center ${bg}">
                  <span class="font-semibold">${label}</span>
                  <span class="font-bold text-blue-600">${item.rank}位</span>
                </div>
              `;
            }).join('')}
          </div>
        </details>
      `;

      resultDiv.innerHTML = html;
    }

    // --- ページ2 画面生成・制御 ---
    function renderPage2() {
      const container = document.getElementById('teams-inputs-container');
      container.innerHTML = '';

      state.teams.forEach((teamName, index) => {
        container.innerHTML += `
          <div class="flex items-center gap-2 bg-gray-50 p-2 rounded border">
            <span class="text-xs text-gray-400 font-bold w-4">${index + 1}</span>
            <input type="text" value="${teamName}" class="border rounded p-1 text-sm flex-1 font-medium" onchange="updateTeamName(${index}, this.value)">
            ${state.teams.length > 2 ? `
              <button onclick="removeTeam(${index})" class="text-red-400 hover:text-red-600 font-bold px-2 text-sm" title="チーム削除">×</button>
            ` : ''}
          </div>
        `;
      });

      const matchesContainer = document.getElementById('matches-list');
      matchesContainer.innerHTML = '';

      const matchList = getMatchList();
      matchList.forEach((m) => {
        matchesContainer.innerHTML += `
          <div class="flex items-center justify-between bg-gray-50 p-3 rounded border">
            <span class="w-1/3 text-right font-medium text-sm md:text-base">${m.home}</span>
            <div class="flex items-center gap-2">
              <input type="number" value="${m.homeScore ?? ''}" placeholder="-" class="w-12 text-center border rounded p-1 text-sm md:text-base font-semibold" onchange="updateScore('${m.key}', 'home', this.value)">
              <span class="font-bold text-gray-400">-</span>
              <input type="number" value="${m.awayScore ?? ''}" placeholder="-" class="w-12 text-center border rounded p-1 text-sm md:text-base font-semibold" onchange="updateScore('${m.key}', 'away', this.value)">
            </div>
            <span class="w-1/3 text-left font-medium text-sm md:text-base">${m.away}</span>
          </div>
        `;
      });
    }

    function updateTeamName(index, newName) {
      newName = newName.trim();
      if (!newName) return renderPage2();
      const oldName = state.teams[index];
      if (oldName === newName) return;
      if (state.teams.includes(newName)) {
        alert("同名のチームが既に存在します。");
        return renderPage2();
      }
      state.teams[index] = newName;

      let newMatchesMap = {};
      Object.keys(state.matchesMap).forEach(key => {
        let [h, a] = key.split('_');
        if (h === oldName) h = newName;
        if (a === oldName) a = newName;
        newMatchesMap[`${h}_${a}`] = state.matchesMap[key];
      });
      state.matchesMap = newMatchesMap;

      renderPage2();
    }

    function addTeam() {
      const newName = `チーム${String.fromCharCode(65 + state.teams.length)}`;
      state.teams.push(newName);
      renderPage2();
    }

    function removeTeam(index) {
      if (state.teams.length <= 2) return;
      const targetName = state.teams[index];
      state.teams.splice(index, 1);

      let newMatchesMap = {};
      Object.keys(state.matchesMap).forEach(key => {
        let [h, a] = key.split('_');
        if (h !== targetName && a !== targetName) {
          newMatchesMap[key] = state.matchesMap[key];
        }
      });
      state.matchesMap = newMatchesMap;

      renderPage2();
    }

    function updateScore(key, side, val) {
      if (!state.matchesMap[key]) {
        state.matchesMap[key] = { homeScore: null, awayScore: null, played: false };
      }
      const match = state.matchesMap[key];
      if (side === 'home') match.homeScore = val !== '' ? parseInt(val) : null;
      if (side === 'away') match.awayScore = val !== '' ? parseInt(val) : null;
      match.played = match.homeScore !== null && match.awayScore !== null;
    }

    function resetScores() {
      if (confirm("全ての入力済みスコアをクリアしますか？")) {
        state.matchesMap = {};
        renderPage2();
      }
    }

    // --- ページ3 ルール・優先順位描画 ---
    function renderPage3() {
      document.getElementById('rule-use-25').checked = state.rules.use25Rule;

      const container = document.getElementById('priority-list');
      container.innerHTML = '';

      state.priorityOrder.forEach((item, index) => {
        const isSubRule = item.id === "subGd" || item.id === "subGf";
        const disabledStyle = (!state.rules.use25Rule && isSubRule) ? "opacity-40" : "";

        container.innerHTML += `
          <div class="flex items-center justify-between bg-gray-50 border p-3 rounded ${disabledStyle}">
            <div class="flex items-center gap-3">
              <span class="bg-blue-600 text-white font-bold w-6 h-6 rounded-full flex items-center justify-center text-xs">${index + 1}</span>
              <span class="font-semibold text-sm">${item.name}</span>
              ${(!state.rules.use25Rule && isSubRule) ? '<span class="text-xs text-red-400 font-normal">(25%OFFのためパス)</span>' : ''}
            </div>
            <div class="flex gap-1">
              <button onclick="movePriority(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-2 py-1 bg-gray-200 text-xs rounded"' : 'class="px-2 py-1 bg-blue-100 text-blue-700 hover:bg-blue-200 font-bold text-xs rounded"'}>▲ 上へ</button>
              <button onclick="movePriority(${index}, 1)" ${index === state.priorityOrder.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed px-2 py-1 bg-gray-200 text-xs rounded"' : 'class="px-2 py-1 bg-blue-100 text-blue-700 hover:bg-blue-200 font-bold text-xs rounded"'}>▼ 下へ</button>
            </div>
          </div>
        `;
      });
    }

    function toggle25Rule() {
      state.rules.use25Rule = document.getElementById('rule-use-25').checked;
      renderPage3();
    }

    function movePriority(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.priorityOrder.length) return;

      const temp = state.priorityOrder[index];
      state.priorityOrder[index] = state.priorityOrder[targetIndex];
      state.priorityOrder[targetIndex] = temp;

      renderPage3();
    }

    function updateRulePts() {
      state.rules.win = parseInt(document.getElementById('pts-win').value) || 0;
      state.rules.draw = parseInt(document.getElementById('pts-draw').value) || 0;
      state.rules.loss = parseInt(document.getElementById('pts-loss').value) || 0;
    }

    // --- 初期化 ---
    switchTab(1);
  </script>
</body>
</html>
